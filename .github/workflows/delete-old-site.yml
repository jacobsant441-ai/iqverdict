# One-off: delete the old StatSniper Cloudflare Pages project (the site now lives at iqverdict.pages.dev).
# Run once by hand, then this file is removed.
name: Delete old site
on: workflow_dispatch
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete the old Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/statsniper"
          # a project with many deployments cannot be deleted until its deployments are: remove them in batches
          for round in $(seq 1 60); do
            IDS=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/deployments?per_page=25" | jq -r '.result[]?.id')
            [ -z "$IDS" ] && break
            for id in $IDS; do curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/deployments/$id?force=true" >/dev/null; done
            echo "round $round done"
          done
          npx --yes wrangler@3.114.0 pages project delete statsniper --yes
